<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack | Gestão de Frotas</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-app { background: #212529; color: white; padding: 20px; border-radius: 0 0 15px 15px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-app text-center">
            <h1>🚚 LogiTrack</h1>
            <p>Sistema de Gerenciamento de Frotas - Tamoio Logística</p>
        </div>

        <div class="row">
            <!-- Formulário -->
            <div class="col-md-4">
                <div class="card p-4">
                    <h4 class="mb-3">Novo Veículo</h4>
                    <div class="mb-3">
                        <label class="form-label">Placa</label>
                        <input type="text" id="placa" class="form-control" placeholder="ABC-1234">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" id="modelo" class="form-control" placeholder="Ex: Sprinter">
                    </div>
                    <button onclick="salvar()" class="btn btn-primary w-100">Cadastrar no Sistema</button>
                </div>
            </div>

            <!-- Tabela -->
            <div class="col-md-8">
                <div class="card p-4">
                    <h4 class="mb-3">Frota Ativa</h4>
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-veiculos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/veiculos';

        async function listar() {
            try {
                const res = await fetch(API_URL);
                const dados = await res.json();
                const body = document.getElementById('tabela-veiculos');
                body.innerHTML = dados.map(v => `
                    <tr>
                        <td><strong>#${v.id}</strong></td>
                        <td>${v.placa}</td>
                        <td>${v.modelo}</td>
                        <td><span class="badge bg-success">${v.status}</span></td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Erro ao listar", e); }
        }

        async function salvar() {
            const v = { 
                placa: document.getElementById('placa').value, 
                modelo: document.getElementById('modelo').value,
                status: 'DISPONIVEL',
                capacidadeCarga: 1000.0
            };
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(v)
            });
            listar();
            document.getElementById('placa').value = '';
            document.getElementById('modelo').value = '';
        }
        listar();
    </script>
</body>
</html>
