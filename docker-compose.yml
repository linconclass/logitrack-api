version: '3.8'
services:
  db:
    image: postgres:15
    container_name: logitrack-db
    restart: always
    environment:
      POSTGRES_USER: lincon
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: logitrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
